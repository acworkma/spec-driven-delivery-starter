# Spec gate for Azure Repos.
# Azure Repos ignores YAML pr: triggers. Add this pipeline as build validation in the
# branch policy for main, with path filter: /specs/*; /.specify/*; /tools/spec_lint.py

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

# Optional: a variable group named spec-gate holding the secret SPEC_LINT_BANNED_TERMS
# (comma-separated customer names, code names or people to keep out of the repo).
# variables:
#   - group: spec-gate

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: python tools/spec_lint.py --report "$(Build.ArtifactStagingDirectory)/spec-gate-report.md"
    displayName: Run the spec gate
    env:
      SPEC_LINT_BANNED_TERMS: $(SPEC_LINT_BANNED_TERMS)

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish the traceability summary
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)"
      artifact: spec-gate-report
